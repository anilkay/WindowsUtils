# Builds self-contained single-file WindowsUtils.exe (no .NET runtime needed) and the
# wutils.exe CLI, and attaches both as zips to the GitHub release for the pushed tag.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish app
        run: >
          dotnet publish WindowsUtils/WindowsUtils.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/app

      - name: Publish CLI
        run: >
          dotnet publish WindowsUtils.Cli/WindowsUtils.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/cli

      - name: Zip app
        shell: pwsh
        run: Compress-Archive publish/app/WindowsUtils.exe "WindowsUtils-${{ github.ref_name }}-win-x64.zip"

      - name: Zip CLI
        shell: pwsh
        run: Compress-Archive publish/cli/wutils.exe "WindowsUtils-cli-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "WindowsUtils-${{ github.ref_name }}-win-x64.zip" "WindowsUtils-cli-${{ github.ref_name }}-win-x64.zip" --title "${{ github.ref_name }}" --generate-notes
